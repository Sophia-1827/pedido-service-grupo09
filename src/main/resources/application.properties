spring.application.name=pedido-service-grupo09

server.port=8071
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Config Server: se ubica por Eureka y se lee el perfil dev
spring.profiles.active=dev
spring.cloud.config.name=pedido-service
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server-grupo09
spring.config.import=optional:configserver:
# Actuator: /actuator/refresh recarga las propiedades sin reiniciar
management.endpoints.web.exposure.include=refresh,health,info